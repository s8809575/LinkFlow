plugins {
    id "com.android.application"
    id "org.jetbrains.kotlin.android"
}

android {
    namespace "com.linkflow.app"
    compileSdk 34

    defaultConfig {
        applicationId "com.linkflow.app"
        minSdk 29
        targetSdk 34
        versionCode 1
        versionName "1.0.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    signingConfigs {
        release {
            def props = new Properties()
            def propsFile = rootProject.file("keystore.properties")
            if (propsFile.exists()) {
                propsFile.withInputStream { props.load(it) }
            }

            def storeFilePath = props.getProperty("STORE_FILE") ?: System.getenv("LINKFLOW_STORE_FILE")
            def storePassword = props.getProperty("STORE_PASSWORD") ?: System.getenv("LINKFLOW_STORE_PASSWORD")
            def keyAlias = props.getProperty("KEY_ALIAS") ?: System.getenv("LINKFLOW_KEY_ALIAS")
            def keyPassword = props.getProperty("KEY_PASSWORD") ?: System.getenv("LINKFLOW_KEY_PASSWORD")

            if (storeFilePath && storePassword && keyAlias && keyPassword) {
                storeFile file(storeFilePath)
                storePassword storePassword
                keyAlias keyAlias
                keyPassword keyPassword
            }
        }
    }

    buildTypes {
        debug {
            applicationIdSuffix ".debug"
            versionNameSuffix "-debug"
        }
        release {
            minifyEnabled false
            shrinkResources false
            signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = "17"
    }
}

dependencies {
    implementation "androidx.core:core-ktx:1.13.1"
    implementation "androidx.appcompat:appcompat:1.7.0"
    implementation "com.google.android.material:material:1.12.0"
    implementation "androidx.constraintlayout:constraintlayout:2.1.4"
    implementation "androidx.security:security-crypto:1.1.0-alpha06"
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-android:1.8.1"

    implementation "androidx.camera:camera-core:1.3.4"
    implementation "androidx.camera:camera-camera2:1.3.4"
    implementation "androidx.camera:camera-lifecycle:1.3.4"
    implementation "androidx.camera:camera-view:1.3.4"
    implementation "com.google.zxing:core:3.5.3"

    // 加密存储
   implementation "androidx.security:security-crypto:1.1.0-alpha06"

    // 协程
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3"

   // 相机扫码
   implementation "androidx.camera:camera-core:1.3.4"
   implementation "androidx.camera:camera-view:1.3.4"
   implementation "com.google.zxing:core:3.5.3"

    testImplementation "junit:junit:4.13.2"
    testImplementation "org.jetbrains.kotlinx:kotlinx-coroutines-test:1.8.1"

    androidTestImplementation "androidx.test:runner:1.6.2"
    androidTestImplementation "androidx.test.ext:junit:1.2.1"
    androidTestImplementation "androidx.test.espresso:espresso-core:3.6.1"
}

