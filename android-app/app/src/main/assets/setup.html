<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>LinkFlow - 连接设置</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: #f2f2f7; min-height:100vh;
    display:flex; flex-direction:column; align-items:center;
    padding: 60px 24px 40px;
}
.icon { font-size: 64px; margin-bottom: 16px; }
h1 { font-size: 28px; font-weight: 700; color: #1d1d1f; margin-bottom: 8px; }
.subtitle { font-size: 14px; color: #86868b; margin-bottom: 40px; text-align: center; line-height: 1.5; }
.card {
    width: 100%; max-width: 360px; background: #fff;
    border-radius: 16px; padding: 20px;
    box-shadow: 0 2px 12px rgba(0,0,0,0.06);
}
.card-title { font-size: 13px; font-weight: 600; color: #86868b; text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 12px; }
.input-row { display:flex; gap:8px; }
input {
    flex:1; padding: 14px 16px; border: 1px solid #e5e5ea; border-radius: 10px;
    font-size: 16px; outline: none; background: #fafafa; transition: border-color 0.2s;
}
input:focus { border-color: #0071e3; background: #fff; }
.btn {
    padding: 14px 20px; background: #0071e3; color: #fff; border: none;
    border-radius: 10px; font-size: 15px; font-weight: 600; cursor: pointer;
    transition: background 0.2s; white-space: nowrap;
}
.btn:active { background: #005bb5; }
.btn:disabled { background: #a0c4e8; }
.status {
    margin-top: 12px; font-size: 13px; text-align: center; min-height: 20px;
    transition: color 0.3s;
}
.status.success { color: #34c759; }
.status.error { color: #ff3b30; }
.hint {
    margin-top: 16px; font-size: 12px; color: #86868b; text-align: center; line-height: 1.6;
}
</style>
</head>
<body>
<div class="icon">&#x1F4BB;</div>
<h1>LinkFlow</h1>
<p class="subtitle">连接你的电脑，开始传输文件与同步剪贴板</p>
<div class="card">
    <div class="card-title">服务器地址</div>
    <div class="input-row">
        <input type="text" id="ipInput" placeholder="输入电脑 IP 地址，如 192.168.1.100" autocomplete="off">
        <button class="btn" id="connectBtn" onclick="connect()">连接</button>
    </div>
    <div class="status" id="status"></div>
</div>
<p class="hint">确保手机和电脑在同一 WiFi 网络下<br>在电脑端启动 LinkFlow 后即可在此输入 IP 连接</p>

<script>
const ipInput = document.getElementById('ipInput');
const connectBtn = document.getElementById('connectBtn');
const statusEl = document.getElementById('status');

// 尝试获取已保存的 IP 并自动填充
try {
    var saved = window.LinkFlowNative.getSavedIP();
    if (saved) ipInput.value = saved;
} catch(e) {}

function setStatus(msg, type) {
    statusEl.textContent = msg;
    statusEl.className = 'status ' + (type || '');
}

function connect() {
    var ip = ipInput.value.trim();
    if (!ip) {
        setStatus('请输入 IP 地址', 'error');
        return;
    }
    connectBtn.disabled = true;
    setStatus('正在连接...', '');
    try {
        window.LinkFlowNative.saveAndConnect(ip);
    } catch(e) {
        setStatus('连接失败: ' + e.message, 'error');
        connectBtn.disabled = false;
    }
}

// 回车键提交
ipInput.addEventListener('keydown', function(e) {
    if (e.key === 'Enter') connect();
});

// 监听原生层发回的连接状态
window.onConnectionResult = function(success, message) {
    connectBtn.disabled = false;
    if (success) {
        setStatus('连接成功！', 'success');
    } else {
        setStatus(message || '连接失败，请检查 IP 地址', 'error');
    }
};
</script>
</body>
</html>
